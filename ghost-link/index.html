<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Link Test - With Consent</title>
<style>
body{font-family:system-ui;background:#0f1115;color:#fff;padding:20px;max-width:700px;margin:auto}
.card{background:#171a21;padding:16px;border-radius:12px;margin-top:16px}
button{padding:12px 18px;border:0;border-radius:9px;background:#4f8cff;color:#fff;font-weight:700;cursor:pointer}
input{width:100%;padding:11px;border-radius:9px;border:1px solid #333;background:#222;color:#fff}
.mut{color:#9aa0aa;font-size:13px}
</style>
</head>
<body>
<h2>Link Test Dashboard - Tester Consent Only</h2>
<p class="mut">This is a TEST project. Nothing is logged until tester clicks "I Agree". For same-device testing only.</p>

<label>Target URL to open after test</label>
<input id="u" value="https://example.com" />
<div style="margin-top:12px"><button onclick="make()">Create Test Link</button></div>
<div id="out"></div>
<div id="view"></div>

<script>
function make(){
  let u = document.getElementById('u').value.trim();
  if(!u.startsWith('http')) u = 'https://'+u;
  let id = 'test-'+Date.now();
  localStorage.setItem(id, JSON.stringify({t:u, hits:[]}));
  let link = location.origin + location.pathname + '?test='+id;
  document.getElementById('out').innerHTML = `<div class="card">Send this to tester:<br><code>${link}</code><br><br><a href="${link}">Open Test Link</a></div>`;
}

// --- Viewer side ---
let params = new URLSearchParams(location.search);
let testId = params.get('test');
if(testId){
  document.body.innerHTML = `
  <h2>⚠️ Test Link</h2>
  <div class="card">
    <b>This is a test link from your team.</b><br>
    If you click Agree, this page will record YOUR OWN IP / City / Device for this test only, and show it on the dashboard.<br><br>
    If you click Decline, NOTHING will be recorded.<br><br>
    <button onclick="agree()">I Agree - Record Me</button>
    <button onclick="decline()" style="background:#333">Decline</button>
  </div>
  <div id="res"></div>`;
}

async function agree(){
  document.getElementById('res').innerHTML = 'Getting info with your permission...';
  let data = {};
  try{
    let r = await fetch('https://ipwho.is/');
    let j = await r.json();
    data = {ip:j.ip, city:j.city, country:j.country, isp:j.connection?.isp, time:new Date().toLocaleString(), ua:navigator.userAgent};
  }catch(e){ data = {error:'IP lookup blocked', time:new Date().toLocaleString()}; }

  // GPS only after Agree + browser permission
  try{
    let pos = await new Promise((res,rej)=> navigator.geolocation.getCurrentPosition(res,rej,{timeout:5000}));
    data.gps = pos.coords.latitude.toFixed(4)+', '+pos.coords.longitude.toFixed(4);
  }catch(e){ data.gps = 'Not allowed / Denied'; }

  let rec = JSON.parse(localStorage.getItem(testId) || '{"hits":[]}');
  rec.hits.push(data);
  localStorage.setItem(testId, JSON.stringify(rec));

  let target = rec.t || 'https://example.com';
  document.getElementById('res').innerHTML = `<div class="card">Recorded for test:<pre>${JSON.stringify(data,null,2)}</pre><a href="${target}">Continue to target →</a><br><br><a href="?dash=${testId}">View Dashboard</a></div>`;
}
function decline(){
  document.getElementById('res').innerHTML = `<div class="card">Declined. Nothing recorded.</div>`;
}

// --- Dashboard ---
let dashId = params.get('dash');
if(dashId){
  let rec = JSON.parse(localStorage.getItem(dashId) || '{"hits":[]}');
  document.body.innerHTML = `<h2>Dashboard - ${rec.hits.length} test opens</h2><div class="card"><pre>${JSON.stringify(rec.hits,null,2)}</pre></div><a href="${location.pathname}">← Back</a>`;
}
</script>
</body>
</html>
