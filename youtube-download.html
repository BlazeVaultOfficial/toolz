<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toolz.lk</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;700&display=swap" rel="stylesheet">
<style>body{font-family:'Noto Sans Sinhala',sans-serif;background:#111;color:#fff;display:flex;justify-content:center;padding:15px}.card{width:100%;max-width:500px;background:#222;padding:20px;border-radius:15px}input{width:100%;padding:14px;border-radius:10px;border:0;background:#000;color:#fff}button{width:100%;padding:14px;margin-top:10px;background:red;color:#fff;border:0;border-radius:10px;font-weight:bold}a{display:block;background:#22c55e;color:#000;padding:12px;text-align:center;border-radius:10px;margin-top:10px;text-decoration:none;font-weight:bold}</style>
</head>
<body>
<div class="card">
<h2 style="text-align:center">Toolz.lk Downloader</h2>
<input id="yt" placeholder="YouTube ලින්ක් එක දාන්න">
<button onclick="dl()">Download Now</button>
<div id="res"></div>
</div>
<script>
async function dl(){
 const url=document.getElementById('yt').value.trim();
 const id=url.match(/(?:v=|\.be\/|shorts\/)([a-zA-Z0-9_-]{11})/)?.[1];
 if(!id){document.getElementById('res').innerHTML="❌ ලින්ක් එක වැරදියි";return;}
 document.getElementById('res').innerHTML="⏳ හොයනවා...";
 try{
  // වැඩ කරන Piped Server එකක්
  const r=await fetch(`https://pipedapi.kavin.rocks/streams/${id}`);
  const d=await r.json();
  if(!d.videoStreams) throw new Error("Video හම්බුනේ නෑ");
  let h=`<p style=color:#22c55e>✅ ${d.title.slice(0,50)}</p>`;
  d.videoStreams.filter(v=>v.mimeType.includes('mp4')).slice(0,3).forEach(v=>{
   h+=`<a href="${v.url}" target="_blank" download>${v.quality} - ඩවුන්ලෝඩ් (${v.mimeType})</a>`;
  });
  document.getElementById('res').innerHTML=h;
 }catch(e){
  document.getElementById('res').innerHTML=`❌ Error: ${e.message}<br><br>මේ Video එකට Piped එක Block නම්, Vercel Backend එකක් හදන්න වෙනවා. මට කියන්න, මම Code එක දෙන්නම්.`;
 }
}
</script>
</body>
</html>
