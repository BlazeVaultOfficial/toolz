<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:#08080d;color:#fff;min-height:100vh}
a{text-decoration:none;color:inherit}

.logo{font-weight:800;font-size:22px}
.logo span{color:#f59e0b}
.hero{text-align:center;padding:60px 24px 30px;max-width:800px;margin:0 auto;position:relative}
.hero::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:600px;height:300px;background:radial-gradient(circle,rgba(245,158,11,0.15) 0%,transparent 70%);pointer-events:none}

.tool-wrap{max-width:680px;margin:20px auto;padding:0 24px}
.downloader{background:linear-gradient(180deg,#141425,#12121d);border:1px solid #1e1e32;border-radius:20px;padding:28px;box-shadow:0 12px 40px rgba(0,0,0,0.5)}
.url-input{width:100%;padding:14px 16px;border:1px solid #26263a;border-radius:12px;font-size:15px;background:#0a0a12;color:#fff;outline:none;transition:0.2s;margin-bottom:14px}
.url-input::placeholder{color:#52525b}
.url-input:focus{border-color:#f59e0b66;box-shadow:0 0 0 3px rgba(245,158,11,0.15)}
.get-info{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(90deg,#f59e0b,#ec4899);color:white;font-size:15px;font-weight:700;cursor:pointer;transition:0.2s}
.get-info:hover{transform:translateY(-1px);filter:brightness(1.1)}
.get-info:disabled{opacity:0.6;cursor:not-allowed;transform:none}
.video-info{display:none;margin-top:26px;padding-top:22px;border-top:1px solid #1e1e32}
.thumbnail{width:100%;border-radius:14px;margin-bottom:16px;border:1px solid #1e1e32}
.video-title{font-size:17px;font-weight:700;margin-bottom:18px;line-height:1.4}
label{display:block;margin-bottom:8px;font-weight:700;font-size:13px;color:#a1a1b5;letter-spacing:0.5px;text-transform:uppercase}
select{width:100%;padding:13px 14px;border:1px solid #26263a;border-radius:12px;font-size:15px;margin-bottom:16px;background:#0a0a12;color:#fff;outline:none}
.download-btn{width:100%;padding:14px;border:none;border-radius:12px;background:#fff;color:#000;font-size:15px;font-weight:800;cursor:pointer;transition:0.2s}
.download-btn:hover{background:#e5e5e5;transform:translateY(-1px)}
.message{margin-top:14px;text-align:center;color:#71717a;font-size:13px;min-height:18px}
.footer{margin-top:50px;background:#0a0a12;border-top:1px solid #1a1a2e;padding:30px 24px;text-align:center;color:#3f3f55;font-size:12px}
</style>
</head>

<body>

<div class="top">
<div class="nav">
<a href="/" class="logo">toolz<span>.run.place</span></a>
<div style="color:#52525b;font-size:12px;font-weight:700">FREE • NO SIGNUP</div>
</div>
</div>

<div class="hero">
<h1>YouTube <span>Downloader</span></h1>
<p>Download YouTube videos in 360p, 720p, 1080p & MP3 - Fast & Private</p>
</div>

<div class="tool-wrap">
<div class="downloader">

<input
type="url"
id="youtubeUrl"
class="url-input"
placeholder="Paste YouTube URL here... https://youtube.com/watch?v=..."
required
>

<button class="get-info" id="getInfoBtn">
Get Video Info 🔥
</button>

<div class="message" id="message"></div>

<div class="video-info" id="videoInfo">

<img
id="thumbnail"
class="thumbnail"
src=""
alt="Video thumbnail"
>

<div class="video-title" id="videoTitle"></div>

<label for="quality">Select Quality</label>

<select id="quality">
<option value="">Select quality</option>
</select>

<button class="download-btn" id="downloadBtn">
Download Now
</button>

</div>
</div>
</div>

<div class="footer">
© 2026 toolz.run.place | Free & Private Tools<br>
Made in 🇱🇰 Sri Lanka
</div>


<script>

const getInfoBtn = document.getElementById("getInfoBtn");
const downloadBtn = document.getElementById("downloadBtn");
const videoInfoDiv = document.getElementById("videoInfo");

const youtubeUrl = document.getElementById("youtubeUrl");
const message = document.getElementById("message");
const thumbnail = document.getElementById("thumbnail");
const videoTitle = document.getElementById("videoTitle");
const quality = document.getElementById("quality");


/* =========================
   GET VIDEO INFORMATION
========================= */

getInfoBtn.addEventListener("click", async () => {

    const url = youtubeUrl.value.trim();

    if (!url) {
        message.textContent = "Please enter a YouTube URL.";
        return;
    }

    message.textContent = "Getting video information...";
    getInfoBtn.disabled = true;

    videoInfoDiv.style.display = "none";

    try {

        const response = await fetch(
            "http://localhost:5000/api/info",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    url: url
                })
            }
        );


        const data = await response.json();


        if (data.status !== "success") {
            throw new Error(
                data.message || "Unable to get video information."
            );
        }


        /* Show thumbnail */

        if (data.thumbnail) {
            thumbnail.src = data.thumbnail;
        }


        /* Show title */

        videoTitle.textContent =
            data.title || "YouTube Video";


        /* Clear old quality options */

        quality.innerHTML = "";


        /* Default option */

        const defaultOption =
            document.createElement("option");

        defaultOption.value = "";
        defaultOption.textContent =
            "Select quality";

        quality.appendChild(defaultOption);


        /* Add available formats */

        if (data.formats && data.formats.length > 0) {

            data.formats.forEach(format => {

                const option =
                    document.createElement("option");

                option.value =
                    format.format_id;

                option.textContent =
                    `${format.quality} (${format.format})`;

                quality.appendChild(option);

            });

        } else {

            const option =
                document.createElement("option");

            option.value = "";
            option.textContent =
                "No formats found";

            quality.appendChild(option);

        }


        /* Show video information */

        videoInfoDiv.style.display = "block";

        message.textContent =
            "Video information loaded successfully!";

    }

    catch (error) {

        console.error(error);

        message.textContent =
            "Error: " + error.message;

    }

    finally {

        getInfoBtn.disabled = false;

    }

});


/* =========================
   DOWNLOAD BUTTON
========================= */

downloadBtn.addEventListener("click", () => {

    const selectedQuality =
        quality.value;

    if (!selectedQuality) {

        alert("Please select a quality.");

        return;

    }

    alert(
        "Download backend is not connected yet."
    );

});


</script>

</body>
