<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OLD PIECES - Downloader</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{font-family: sans-serif; background:#0a0a0a; color:#e5e5e5;}
.glass{ background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08);}
</style>
</head>
<body class="min-h-screen flex flex-col items-center p-4">
<div class="w-full max-w-3xl mt-10">
  <div class="glass rounded-[24px] p-6">
    <input id="urlInput" type="text" placeholder="https://..." class="w-full bg-black border border-white/10 rounded-full px-6 py-4 outline-none">
    <div class="flex gap-2 mt-4">
      <select id="quality" class="flex-1 bg-black border border-white/10 rounded-full px-4 py-3"><option value="720" selected>720p Video</option><option value="1080">1080p</option><option value="max">Max</option></select>
      <select id="mode" class="flex-1 bg-black border border-white/10 rounded-full px-4 py-3"><option value="auto">Video</option><option value="audio">Audio MP3</option></select>
      <button onclick="fetchVideo()" id="goBtn" class="bg-white text-black rounded-full px-8 py-3 font-bold">GO</button>
    </div>
  </div>

  <div id="resultCard" class="hidden mt-6 glass rounded-[24px] p-6">
    <img id="thumb" class="w-full rounded-xl mb-4">
    <h3 id="vTitle" class="text-lg mb-2"></h3>
    <p id="vStatus" class="text-xs opacity-50 mb-4"></p>

    <!-- මේක තමයි වැදගත්ම Fix එක -->
    <a id="realDownloadLink" href="#" target="_blank" class="block w-full text-center bg-white text-black rounded-full py-4 font-bold tracking-widest">OPEN DOWNLOAD LINK</a>
    <p class="text-xs text-center mt-3 opacity-40">Link එක Open වෙලා Video එක Play වුනොත්, තිත් 3 ඔබලා Download / Save Video ඔබන්න. Android වලට ඒක තමයි හරියනම විදිහ.</p>
    <p id="status" class="text-xs text-center mt-2 opacity-60"></p>
  </div>
  <div id="errorBox" class="hidden mt-4 bg-red-500/20 p-4 rounded-xl text-center text-sm"></div>
</div>

<script>
const API = "https://cobalt-tools-production-5ad7.up.railway.app/";
let lastResponse = null;

async function fetchVideo(){
  const url = document.getElementById('urlInput').value.trim();
  if(!url) return;
  document.getElementById('goBtn').innerText = "...";
  document.getElementById('errorBox').classList.add('hidden');
  try{
    const res = await fetch(API, {
      method: "POST",
      headers: { "Accept": "application/json", "Content-Type": "application/json" },
      body: JSON.stringify({ url: url, videoQuality: document.getElementById('quality').value, downloadMode: document.getElementById('mode').value, audioFormat: "mp3" })
    });
    const data = await res.json();
    if(data.status === "error") throw new Error(data.error.code || JSON.stringify(data.error));

    lastResponse = data;
    document.getElementById('resultCard').classList.remove('hidden');
    document.getElementById('thumb').src = data.thumb || "";
    document.getElementById('vTitle').innerText = data.filename || "Ready";
    document.getElementById('vStatus').innerText = data.status.toUpperCase();

    // Fix: කෙලින්ම Tunnel Link එක Button එකට දානවා, Blob කරන්නේ නෑ
    const linkEl = document.getElementById('realDownloadLink');
    linkEl.href = data.url;
    document.getElementById('status').innerText = "Verified ✓ - බොත්තම ඔබන්න";

    // Auto open once on mobile to trigger download
    // window.open(data.url, "_blank");

  }catch(e){
    document.getElementById('errorBox').innerText = e.message;
    document.getElementById('errorBox').classList.remove('hidden');
  }finally{
    document.getElementById('goBtn').innerText = "GO";
  }
}
</script>
</body>
</html>
