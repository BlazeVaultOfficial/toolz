<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Downloader</title>
</head>
<body style="background:#000;color:#fff;font-family:sans-serif;padding:20px;display:flex;justify-content:center">
<div style="max-width:420px;width:100%">
<input id="u" placeholder="Paste YouTube link" style="width:100%;padding:16px;border-radius:30px;background:#111;border:1px solid #222;color:#fff">
<button onclick="go()" id="b" style="width:100%;margin-top:10px;padding:16px;border-radius:30px;background:#fff;color:#000;font-weight:bold;border:0">GET VIDEO</button>

<div id="r" style="display:none;margin-top:20px">
<video id="v" controls playsinline controlsList="download" style="width:100%;border-radius:20px;background:#111"></video>
<p style="font-size:12px;opacity:.6;margin-top:12px;text-align:center">Video එක උඩ Long Press කරලා > Download video ඔබන්න.<br>එතකොට Failed වෙන්නේ නෑ.</p>
<a id="o" target="_blank" style="display:block;margin-top:12px;text-align:center;background:#222;color:#fff;padding:14px;border-radius:30px;text-decoration:none">Open in New Tab</a>
</div>
<p id="e" style="display:none;color:#ff5555;font-size:12px;margin-top:10px;text-align:center"></p>
</div>

<script>
async function go(){
 const url=document.getElementById('u').value.trim();
 if(!url)return;
 const btn=document.getElementById('b');
 btn.textContent='Loading...';
 try{
  const res=await fetch('https://cobalt-tools-production-5ad7.up.railway.app/',{
   method:'POST',
   headers:{'Content-Type':'application/json','Accept':'application/json'},
   body:JSON.stringify({url:url})
  });
  const d=await res.json();
  if(!d.url) throw new Error(d.error?.code || 'API failed');
  document.getElementById('r').style.display='block';
  document.getElementById('v').src=d.url;
  document.getElementById('o').href=d.url;
 }catch(err){
  document.getElementById('e').style.display='block';
  document.getElementById('e').innerText=err.message;
 }finally{btn.textContent='GET VIDEO'}
}
</script>
</div>
</body>
</html>
