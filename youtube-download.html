<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Download</title></head>
<body style="background:#000;color:#fff;font-family:sans-serif;display:flex;justify-content:center;padding:20px">
<div style="width:100%;max-width:400px">
<input id="u" placeholder="Paste link" style="width:100%;padding:16px;border-radius:30px;border:1px solid #333;background:#111;color:#fff">
<button onclick="go()" style="width:100%;margin-top:10px;padding:16px;border-radius:30px;background:#fff;color:#000;font-weight:bold">GET</button>
<div id="out" style="margin-top:20px;display:none;text-align:center">
<a id="btn" target="_blank" style="display:block;background:#fff;color:#000;padding:18px;border-radius:30px;text-decoration:none;font-weight:bold">OPEN VIDEO - 3 dots > Download</a>
<p style="font-size:11px;opacity:0.5;margin-top:10px">බොත්තම ඔබලා අලුත් Tab එකේ Video එක Open කරලා ⋮ > Download ඔබන්න</p>
</div>
</div>
<script>
async function go(){
const url=document.getElementById('u').value.trim();
if(!url)return;
const res=await fetch("https://cobalt-tools-production-5ad7.up.railway.app/",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url:url})});
const data=await res.json();
if(data.url){
document.getElementById('out').style.display='block';
document.getElementById('btn').href=data.url;
window.open(data.url,"_blank");
}else{alert(JSON.stringify(data))}
}
</script>
</body>
</html>
