<!DOCTYPE html>
<html>
<head>
  <title>YouTube Downloader - Toolz.lk</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{font-family:system-ui;background:#0f0f0f;color:white;display:flex;justify-content:center;padding:20px}
    .box{max-width:480px;width:100%;background:#1e1e1e;padding:25px;border-radius:16px;margin-top:30px}
    input{width:100%;padding:14px;border-radius:10px;border:0;box-sizing:border-box;font-size:16px}
    button{width:100%;padding:14px;margin-top:12px;background:#ff0000;color:white;border:0;border-radius:10px;font-size:17px;font-weight:bold;cursor:pointer}
    #result{margin-top:20px}
    a.dl{display:block;padding:14px;background:#22c55e;color:white;text-align:center;border-radius:10px;text-decoration:none;font-weight:bold;margin-top:10px}
  </style>
</head>
<body>
<div class="box">
  <h2 style="text-align:center">📥 Toolz.lk YouTube Downloader</h2>
  <input id="yturl" placeholder="https://youtube.com/watch?v=..."/>
  <button onclick="downloadYT()">Download Now</button>
  <div id="result"></div>
</div>

<script>
async function downloadYT(){
  const url = document.getElementById('yturl').value.trim();
  if(!url) return alert("Link එක දාන්න!");
  const resultDiv = document.getElementById('result');
  resultDiv.innerHTML = "⏳ Loading... Please wait...";

  try {
    const res = await fetch("https://co.wuk.sh/api/json", {
      method: "POST",
      headers: {"Content-Type":"application/json", "Accept":"application/json"},
      body: JSON.stringify({url: url, vQuality: "720", filenamePattern: "basic"})
    });
    const data = await res.json();
    
    if(data.url){
      resultDiv.innerHTML = `<a class="dl" href="${data.url}" target="_blank" download>✅ Download Video (720p)</a><p style="font-size:12px;text-align:center;margin-top:10px;color:#aaa">Link එක click කරලා Download කරගන්න</p>`;
    } else if(data.picker && data.picker.length > 0){
      let html = "<p>Qualities:</p>";
      data.picker.forEach(item => {
        html += `<a class="dl" href="${item.url}" target="_blank">${item.quality || item.type} - Download</a>`;
      });
      resultDiv.innerHTML = html;
    } else {
      resultDiv.innerHTML = "Error: " + JSON.stringify(data);
    }
  } catch(e){
    resultDiv.innerHTML = "❌ Error: " + e.message + "<br> වෙන API එකකින් උත්සාහ කරමු...";
    // fallback
    try{
      const res2 = await fetch("https://api.cobalt.tools/api/json", {method:"POST", headers:{"Content-Type":"application/json","Accept":"application/json"}, body: JSON.stringify({url: url})});
      const data2 = await res2.json();
      if(data2.url) resultDiv.innerHTML = `<a class="dl" href="${data2.url}" target="_blank">✅ Download Video</a>`;
    }catch(e2){ resultDiv.innerHTML = "Failed, YouTube link එක හරිද බලන්න"; }
  }
}
</script>
</body>
</html>
