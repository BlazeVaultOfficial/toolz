<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toolz.lk - YouTube Downloader</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f0f0f;color:#fff;font-family:Inter,sans-serif;display:flex;justify-content:center;padding:20px;min-height:100vh}
.container{width:100%;max-width:520px}
.header{text-align:center;margin:30px 0}
.header h1{color:#ff0000;font-size:32px}
.header p{color:#aaa;margin-top:8px}
.card{background:#212121;padding:24px;border-radius:20px;border:1px solid #333}
.card input{width:100%;padding:16px;border-radius:12px;border:1px solid #333;background:#000;color:#fff;font-size:16px;outline:none}
.card input:focus{border-color:#ff0000}
.card button{width:100%;padding:16px;margin-top:12px;background:#ff0000;color:#fff;border:0;border-radius:12px;font-weight:bold;font-size:16px;cursor:pointer}
.card button:disabled{opacity:0.6}
.result{margin-top:16px}
.thumb{width:100%;border-radius:12px;margin:12px 0}
a.dl{display:block;background:#22c55e;color:#000;padding:14px;text-align:center;border-radius:12px;margin-top:10px;text-decoration:none;font-weight:bold}
a.dl.mp3{background:#3b82f6;color:#fff}
.status{padding:12px;border-radius:10px;background:#1a1a1a;text-align:center;color:#ff0;font-size:14px}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>📥 Toolz.lk</h1>
    <p>Fast YouTube Video Downloader - No Ads</p>
  </div>

  <div class="card">
    <input id="ytInput" type="text" placeholder="Paste YouTube link here... https://youtu.be/...">
    <button id="dlBtn" onclick="startDownload()">Download Now</button>
    <div id="result" class="result"></div>
  </div>
</div>

<script>
async function startDownload(){
  const url = document.getElementById('ytInput').value.trim();
  const resultDiv = document.getElementById('result');
  const btn = document.getElementById('dlBtn');

  if(!url){
    resultDiv.innerHTML = '<div class="status" style="color:#ff4444">❌ Please paste a link</div>';
    return;
  }

  const videoId = url.match(/(?:v=|be\/|shorts\/)([A-Za-z0-9_-]{11})/)?.[1];
  if(!videoId){
    resultDiv.innerHTML = '<div class="status" style="color:#ff4444">❌ Invalid YouTube URL</div>';
    return;
  }

  btn.innerText = '⏳ Finding...';
  btn.disabled = true;
  resultDiv.innerHTML = '<div class="status">⏳ Connecting to servers...</div>';

  const servers = [
    'https://inv.nadeko.net',
    'https://invidious.privacydev.net',
    'https://yt.artemislena.eu',
    'https://inv.zzls.xyz'
  ];

  for(let i=0; i<servers.length; i++){
    let base = servers[i];
    try{
      resultDiv.innerHTML = `<div class="status">⏳ Trying server ${i+1}/4...</div>`;
      const response = await fetch(`${base}/api/v1/videos/${videoId}`);
      if(!response.ok) continue;

      const data = await response.json();
      if(!data.title) continue;

      // Success
      let html = `<div style="font-weight:bold;margin-bottom:5px">✅ ${data.title}</div>`;
      let thumbUrl = data.videoThumbnails? data.videoThumbnails[3]?.url || data.videoThumbnails[0]?.url : `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg`;
      html += `<img class="thumb" src="${thumbUrl}" alt="thumbnail">`;

      // Video formats
      let formats = data.formatStreams? data.formatStreams.filter(f => f.container === 'mp4').sort((a,b) => (b.height||0)-(a.height||0)).slice(0,4) : [];
      if(formats.length === 0){
        formats = data.adaptiveFormats? data.adaptiveFormats.filter(f=>f.container==='mp4').slice(0,3) : [];
      }

      formats.forEach(f => {
        let label = f.qualityLabel || (f.height? f.height+'p' : 'MP4');
        html += `<a class="dl" href="${f.url}" target="_blank" rel="noopener">⬇️ ${label} Download</a>`;
      });

      // Audio only
      if(data.adaptiveFormats){
        let audio = data.adaptiveFormats.filter(f => f.type && f.type.includes('audio')).pop();
        if(audio){
          html += `<a class="dl mp3" href="${audio.url}" target="_blank" rel="noopener">🎵 MP3 Audio Download</a>`;
        }
      }

      resultDiv.innerHTML = html;
      btn.innerText = 'Download Now';
      btn.disabled = false;
      return;

    }catch(err){
      continue;
    }
  }

  resultDiv.innerHTML = '<div class="status" style="color:#ff4444">❌ All servers busy. Wait 10 seconds and try again.</div>';
  btn.innerText = 'Download Now';
  btn.disabled = false;
}
</script>
</body>
  </html>
