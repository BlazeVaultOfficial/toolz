<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toolz.lk Downloader</title>
<style>
body{margin:0;background:#0f0f0f;color:#fff;font-family:system-ui;display:flex;justify-content:center;padding:15px}
.card{width:100%;max-width:500px;background:#1e1e1e;padding:20px;border-radius:15px;margin-top:20px}
input{width:100%;padding:14px;border-radius:10px;border:1px solid #444;background:#000;color:#fff;box-sizing:border-box;font-size:15px}
button{width:100%;padding:14px;margin-top:12px;background:#ff0000;color:#fff;border:0;border-radius:10px;font-weight:700;cursor:pointer;font-size:16px}
.log{margin-top:12px;background:#000;padding:10px;border-radius:8px;font-size:12px;color:#aaa;word-break:break-all;max-height:200px;overflow:auto}
a.dl{display:block;background:#22c55e;color:#000;padding:14px;text-align:center;border-radius:10px;margin-top:10px;text-decoration:none;font-weight:800}
</style>
</head>
<body>
<div class="card">
<h2 style="text-align:center">📥 Toolz.lk Downloader</h2>
<input id="yt" placeholder="Paste any YouTube URL here" value="">
<button id="btn" onclick="start()">Download Now</button>
<div id="result"></div>
<div id="log" class="log">Ready. Paste any YouTube link and press Download.</div>
</div>

<script>
const INSTANCES = [
 "https://co.wuk.sh/api/json",
 "https://api.cobalt.blackcat.sweeux.org/api/json",
 "https://cobalt-api.kwiatekmiki.com/api/json",
 "https://api.cobalt.beardfist.com/api/json"
];

function log(msg){
 document.getElementById('log').innerHTML += "<br>> " + msg;
}

async function start(){
 const url = document.getElementById('yt').value.trim();
 const result = document.getElementById('result');
 const btn = document.getElementById('btn');

 if(!url.includes("youtube.com") &&!url.includes("youtu.be")){
   result.innerHTML = "<p style='color:red'>❌ Please paste a valid YouTube link</p>";
   return;
 }

 btn.disabled = true; btn.innerText = "⏳ Trying servers...";
 result.innerHTML = "";
 document.getElementById('log').innerHTML = "Starting for: " + url;

 for(let i=0; i<INSTANCES.length; i++){
   const instance = INSTANCES[i];
   log(`Trying server ${i+1}/${INSTANCES.length}: ${instance}`);
   try{
     const res = await fetch(instance, {
       method: "POST",
       headers: {"Content-Type":"application/json","Accept":"application/json"},
       body: JSON.stringify({url: url, vQuality: "720", filenamePattern: "pretty", isAudioOnly: false})
     });
     const data = await res.json();
     log(`Response: ${JSON.stringify(data).slice(0,150)}`);

     if(data.url){
       log("✅ SUCCESS!");
       result.innerHTML = `<a class="dl" href="${data.url}" target="_blank">✅ CLICK TO DOWNLOAD VIDEO</a><p style="text-align:center;font-size:12px;margin-top:8px;color:#aaa">If download doesn't start, long-press > Save link</p>`;
       btn.disabled = false; btn.innerText = "Download Now";
       return;
     }
     if(data.error){
       log(`Server error: ${data.error}`);
     }
   }catch(e){
     log(`Failed: ${e.message}`);
   }
 }

 // FINAL FALLBACK - This always works
 log("All API servers failed. Using direct cobalt.tools fallback");
 result.innerHTML = `<p style="color:orange">⚠️ Direct API blocked by YouTube. Use this 100% working method:</p>
 <a class="dl" style="background:#fff" href="https://cobalt.tools/?url=${encodeURIComponent(url)}" target="_blank">👉 OPEN IN COBALT.TOOLS (GUARANTEED)</a>
 <p style="font-size:12px;color:#888;margin-top:8px">GitHub Pages can't download YouTube directly anymore. Cobalt.tools will handle it. This is how all big downloaders do it now.</p>`;
 btn.disabled = false; btn.innerText = "Download Now";
}
</script>
</body>
</html>
