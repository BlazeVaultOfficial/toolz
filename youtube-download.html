<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toolz.lk Downloader</title>
<style>
body{background:#0f0f0f;color:#fff;font-family:sans-serif;display:flex;justify-content:center;padding:20px}
.box{width:100%;max-width:520px;background:#212121;padding:22px;border-radius:18px}
input{width:100%;padding:15px;border-radius:12px;border:1px solid #333;background:#000;color:#fff;font-size:16px}
button{width:100%;padding:15px;margin-top:12px;background:#ff0000;color:#fff;border:0;border-radius:12px;font-weight:bold;font-size:16px}
a.dl{display:block;background:#22c55e;color:#000;padding:14px;text-align:center;border-radius:12px;margin-top:12px;text-decoration:none;font-weight:bold}
.thumb{width:100%;border-radius:12px;margin:12px 0}
</style>
</head>
<body>
<div class="box">
<h2 style="text-align:center;color:#ff0000">📥 Toolz.lk</h2>
<input id="yt" placeholder="YouTube link paste karanna...">
<button id="btn" onclick="go()">Download Now</button>
<div id="out" style="margin-top:15px"></div>
</div>
<script>
async function go(){
 const url=document.getElementById('yt').value.trim();
 const out=document.getElementById('out');
 const btn=document.getElementById('btn');
 const id=url.match(/(?:v=|be\/|shorts\/)([A-Za-z0-9_-]{11})/)?.[1];
 if(!id){out.innerHTML='❌ Wrong link';return;}
 btn.innerText='⏳ Loading...';btn.disabled=true;out.innerHTML='⏳ Server connect wenawa...';

 // TRY 1: Cobalt new API
 try{
  const r=await fetch('https://co.wuk.sh/api/json',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({url:url})});
  const j=await r.json();
  if(j.url){
   out.innerHTML=`<img class=thumb src="https://i.ytimg.com/vi/${id}/hqdefault.jpg"><a class=dl href="${j.url}" target=_blank>⬇️ DOWNLOAD NOW</a>`;
   btn.innerText='Download Now';btn.disabled=false;return;
  }
 }catch(e){}

 // TRY 2: Invidious via CORS Proxy (this bypasses the busy error)
 try{
  const proxy=`https://api.allorigins.win/raw?url=${encodeURIComponent('https://inv.nadeko.net/api/v1/videos/'+id)}`;
  const r=await fetch(proxy);
  const d=await r.json();
  if(d.title && d.formatStreams){
   let h=`<b>✅ ${d.title}</b><img class=thumb src="https://i.ytimg.com/vi/${id}/hqdefault.jpg">`;
   d.formatStreams.filter(f=>f.container==='mp4').slice(0,3).forEach(f=>{h+=`<a class=dl href="${f.url}" target=_blank>${f.qualityLabel} Download</a>`});
   out.innerHTML=h;btn.innerText='Download Now';btn.disabled=false;return;
  }
 }catch(e){}

 out.innerHTML='❌ All servers busy now. Try again in 20 sec. Link eka Shorts nam normal link ekak daanna.';
 btn.innerText='Download Now';btn.disabled=false;
}
</script>
</body>
</html>
