<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
</head><body style="background:#000;color:#fff;padding:20px;font-family:sans-serif">
<input id="u" style="width:100%;padding:15px;border-radius:20px;background:#111;color:#fff" placeholder="link">
<button onclick="go()" style="width:100%;padding:15px;margin-top:10px;border-radius:20px;background:#fff;font-weight:bold">GET</button>
<div id="o" style="display:none;margin-top:20px">
<video id="v" controls playsinline controlsList="download" style="width:100%;border-radius:15px;background:#111"></video>
<a id="a" target="_blank" style="display:block;margin-top:10px;background:#222;padding:15px;border-radius:20px;text-align:center;color:#fff;text-decoration:none">නොපෙනේ නම් මෙතන ඔබන්න</a>
</div>
<script>
async function go(){
 let url=document.getElementById('u').value;
 let r=await fetch('https://co.wuk.sh/api/json',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:url})});
 let d=await r.json();
 let link=d.url;
 document.getElementById('o').style.display='block';
 document.getElementById('v').src=link;
 document.getElementById('a').href=link;
}
</script>
</body></html>
