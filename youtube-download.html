<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toolz.lk Downloader</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Noto Sans Sinhala',sans-serif;background:#0f0f0f;color:#fff;display:flex;justify-content:center;padding:15px}
.card{width:100%;max-width:500px;background:#1e1e1e;padding:22px;border-radius:16px;margin-top:30px;border:1px solid #333;text-align:center}
input{width:100%;padding:14px;border-radius:10px;border:1px solid #444;background:#000;color:#fff;box-sizing:border-box;font-size:15px}
button{width:100%;padding:14px;margin-top:12px;background:#ff0000;color:#fff;border:0;border-radius:10px;font-weight:700;cursor:pointer;font-size:16px;font-family:'Noto Sans Sinhala'}
.info{font-size:12px;color:#888;margin-top:12px}
</style>
</head>
<body>
<div class="card">
<h2>📥 Toolz.lk YouTube Downloader</h2>
<p style="color:#aaa;font-size:13px">ඕනම YouTube ලින්ක් එකක් දාන්න</p>
<input id="yt" placeholder="https://youtu.be/...">
<button onclick="go()">Download Now</button>
<p class="info">✅ 100% වැඩ කරනවා - No Error</p>
</div>

<script>
function go(){
 const url = document.getElementById('yt').value.trim();
 if(!url){ alert("ලින්ක් එක දාන්න"); return; }
 // මෙතනින් cobalt.tools එකට යනවා - ඒක හැමදාම වැඩ කරනවා
 window.open("https://cobalt.tools/?url=" + encodeURIComponent(url), "_blank");
}
</script>
</body>
</html>
