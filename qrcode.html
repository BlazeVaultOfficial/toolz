<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR Code Maker - Toolz.run.place</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:#08080d;color:#fff;min-height:100vh}
.top{position:sticky;top:0;z-index:99;background:rgba(8,8,13,0.9);backdrop-filter:blur(16px);border-bottom:1px solid #19192a}
.nav{max-width:1280px;margin:0 auto;padding:14px 24px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:800;font-size:22px}.logo span{color:#8b5cf6}
.btn{padding:9px 16px;border-radius:100px;font-size:12.5px;font-weight:700;border:1px solid #22223a;background:#12121e;color:#a1a1b5;text-decoration:none}
.btn.primary{background:#fff;color:#000}
.main{max-width:720px;margin:0 auto;padding:40px 24px;text-align:center}
.main h1{font-size:42px;font-weight:800;letter-spacing:-2px}
.main h1 em{background:linear-gradient(90deg,#8b5cf6,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-style:normal}
.main p{color:#71717a;margin-top:10px}
.box{margin-top:30px;background:#12121d;border:1px solid #1e1e32;border-radius:18px;padding:24px;text-align:left}
.input{width:100%;background:#08080d;border:1px solid #1e1e32;border-radius:12px;padding:14px 16px;color:#fff;font-size:15px;outline:none}
.input:focus{border-color:#8b5cf6}
.gen{margin-top:14px;width:100%;padding:14px;border-radius:12px;border:none;background:linear-gradient(90deg,#8b5cf6,#ec4899);color:#fff;font-weight:800;font-size:14px;cursor:pointer}
.qr-wrap{margin-top:24px;background:#fff;border-radius:16px;padding:20px;display:none;place-items:center}
.qr-wrap.show{display:grid}
#qrcode img{margin:0 auto}
.down{margin-top:14px;display:none;width:100%;padding:12px;border-radius:12px;border:1px solid #22223a;background:#1c1c2e;color:#fff;font-weight:700;cursor:pointer;text-align:center}
</style>
</head>
<body>
<div class="top"><div class="nav">
<a href="index.html" class="logo">toolz<span>.run.place</span></a>
<a href="index.html" class="btn primary">← Back to Tools</a>
</div></div>

<div class="main">
<h1>QR Code <em>Maker</em></h1>
<p>Paste any URL and generate QR instantly - 100% offline</p>

<div class="box">
<input id="urlInput" class="input" type="url" placeholder="https://www.example.com">
<button class="gen" onclick="makeQR()">Generate QR Code →</button>
<div id="qrWrap" class="qr-wrap"><div id="qrcode"></div></div>
<button id="downBtn" class="down" onclick="downloadQR()">⬇️ Download PNG</button>
</div>
</div>

<script>
let qr;
function makeQR(){
 let url = document.getElementById('urlInput').value.trim();
 if(!url){alert('Paste URL first!');return}
 if(!url.startsWith('http')) url = 'https://'+url;
 document.getElementById('qrWrap').classList.add('show');
 document.getElementById('qrcode').innerHTML='';
 qr = new QRCode(document.getElementById('qrcode'),{text:url,width:220,height:220,colorDark:"#000",colorLight:"#fff",correctLevel:QRCode.CorrectLevel.H});
 document.getElementById('downBtn').style.display='block';
}
function downloadQR(){
 let img = document.querySelector('#qrcode img');
 if(!img) return;
 let a=document.createElement('a'); a.href=img.src; a.download='toolz-qr.png'; a.click();
}
</script>
</body>
</html>
